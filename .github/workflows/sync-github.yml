name: "3 · Sync GitHub sources"

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_SYNC_LIMIT: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Discover APIs on GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SEARCH_TOKEN || github.token }}
        run: node scripts/sync-github.mjs
      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "data: sync catalog from GitHub discovery"
          git push
