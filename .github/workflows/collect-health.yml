name: 影视源页面----在线巡检

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARCHIVE_KEEP: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe all catalog APIs
        run: node scripts/monitor.mjs
      - name: Commit results if changed
        run: |
          DAY=$(node -e "console.log(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()))")
          bash scripts/git-push-catalog.sh "data: update endpoint status ${DAY}" docs/catalog.json public/collect-assets/catalog.json data/
