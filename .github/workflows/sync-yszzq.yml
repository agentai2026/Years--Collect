name: "1 - Sync yszzq.com"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-yszzq
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync from yszzq.com
        run: node scripts/sync-yszzq.mjs
      - name: Commit catalog if changed
        run: bash scripts/git-push-catalog.sh "data: sync catalog from yszzq.com" docs/catalog.json
