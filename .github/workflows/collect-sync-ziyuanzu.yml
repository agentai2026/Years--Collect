name: Sync ziyuanzu.com

on:
  workflow_dispatch: {}
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-ziyuanzu
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync from ziyuanzu.com
        run: node scripts/sync-ziyuanzu.mjs
      - name: Commit catalog if changed
        run: bash scripts/git-push-catalog.sh "data: sync catalog from ziyuanzu.com" docs/catalog.json