name: Classify categories

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: write

concurrency:
  group: classify-categories
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Detect types and categories
        run: node scripts/classify.mjs
      - name: Commit catalog if changed
        run: bash scripts/git-push-catalog.sh "data: refresh API categories and types" docs/catalog.json