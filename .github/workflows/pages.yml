name: Deploy Pages

# Build Astro site and publish dist/ to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "docs/catalog.json"
      - "public/collect-assets/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "astro.config.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - "Collect maintenance"
      - "Health probe"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify catalog
        run: |
          test -f docs/catalog.json
          node -e "const d=require('./docs/catalog.json'); if(!Array.isArray(d.apis)||!d.apis.length) process.exit(1); console.log('catalog apis', d.apis.length, 'updated', d.updated);"
          # Astro serves the public mirror; keep it identical to canonical docs/
          mkdir -p public/collect-assets
          cp docs/catalog.json public/collect-assets/catalog.json
          test -f public/collect-assets/catalog.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          GITHUB_PAGES: "1"
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
