name: "2 · Sync ziyuanzu.com"

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ziyuanzu
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYNC_LIMIT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync from ziyuanzu.com
        run: node scripts/sync-ziyuanzu.mjs
      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "data: sync catalog from ziyuanzu.com"
          git push
