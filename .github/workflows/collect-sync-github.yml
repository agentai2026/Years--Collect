name: Sync GitHub sources

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-github
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_SYNC_LIMIT: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Discover APIs on GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SEARCH_TOKEN || github.token }}
        run: node scripts/sync-github.mjs
      - name: Commit catalog if changed
        run: bash scripts/git-push-catalog.sh "data: sync catalog from GitHub discovery" docs/catalog.json